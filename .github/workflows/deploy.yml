name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      # Vendor tesseract OCR assets (core wasm + worker + traineddata) from
      # node_modules + tessdata, served from 'self' so the app CSP allows OCR.
      # Must run before the test suites (browser OCR test) and the build.
      - run: npm run ocr:assets
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test
      # Real-browser regression tests (ISSUE-1..5 guards). Uses the system Google
      # Chrome that the ubuntu runner ships (Playwright channel: 'chrome');
      # install-deps pulls the shared libraries Chrome needs in CI.
      - run: npx playwright install-deps chromium
      - run: npm run test:browser
      - run: npm run build
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
